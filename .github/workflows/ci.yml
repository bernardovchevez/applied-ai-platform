name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Python 3.12 · Compile & Pytest
    runs-on: ubuntu-latest
    env:
      APP_ENV: localhost
      STATE_STORE_BACKEND: sqlite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: platform/bff/requirements-bff.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platform/bff/requirements-bff.txt

      - name: Verify syntax across all platform modules
        run: |
          python -m compileall -q shared stores guardrails rag agents platform scripts tests

      - name: Run unit & BFF contract test suite
        run: |
          pytest -v
